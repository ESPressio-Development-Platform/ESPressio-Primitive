name: Platform Redesign Boundaries

on:
  push:
    branches: [primitives_redesign]
  pull_request:
    branches: [primitives_redesign]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  structural-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validator
        uses: actions/checkout@v4
        with:
          path: validator

      - name: Checkout current public redesign graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p repos
          repositories=(
            Primitive System Serializable Persistence Task Timing Threads Event Command State
            Adapters Radio Mesh MeshAdapters RadioAdapters Sockets Serial WiFi ESP32
            Logging Security Units Observable Web Lua NRF24
          )
          for repository in "${repositories[@]}"; do
            echo "Checking out ESPressio-${repository}/primitives_redesign"
            git clone --quiet --depth 1 --branch primitives_redesign \
              "https://x-access-token:${GH_TOKEN}@github.com/ESPressio-Development-Platform/ESPressio-${repository}.git" \
              "repos/ESPressio-${repository}"
          done

      - name: Validate locked dependency and migration boundaries
        run: python validator/tools/validate_platform_boundaries.py repos

      - name: V11-02 validate production-source eradication
        run: python validator/tools/validate_v11_source_eradication.py repos

      - name: V11-03 validate live instructional and CI surfaces
        run: python validator/tools/validate_v11_live_surfaces.py repos

      - name: V11-04 validate exact final dependency DAG
        run: python validator/tools/validate_v11_dependency_dag.py repos

      - name: V11-05 validate forbidden edges and redesign branch guards
        run: python validator/tools/validate_v11_forbidden_edges.py repos

      - name: V11-06 classify every current test and validation artifact
        run: python validator/tools/validate_v11_test_classification.py repos

      - name: V11-07 compile restricted host public headers
        run: python validator/tools/validate_v11_host_headers.py repos

      - name: V11-07 sanitize real Thread capability composition
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/repos"
          c++ -std=c++17 -Wall -Wextra -Werror -fno-rtti \
            -fsanitize=address,undefined -fno-omit-frame-pointer -pthread \
            validator/tests/platform_thread_capability_integration.cpp \
            -I"$root/ESPressio-Primitive/src" \
            -I"$root/ESPressio-System/src" \
            -I"$root/ESPressio-Serializable/src" \
            -I"$root/ESPressio-Persistence/src" \
            -I"$root/ESPressio-Security/src" \
            -I"$root/ESPressio-Task/src" \
            -I"$root/ESPressio-Task/tests" \
            -I"$root/ESPressio-Timing/src" \
            -I"$root/ESPressio-Timing/tests/stubs" \
            -I"$root/ESPressio-Units/src" \
            -I"$root/ESPressio-Observable/src" \
            -I"$root/ESPressio-Threads/src" \
            -I"$root/ESPressio-Event/src" \
            -I"$root/ESPressio-Command/src" \
            -I"$root/ESPressio-State/src" \
            -o /tmp/platform_thread_capability_sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/platform_thread_capability_sanitized

      - name: V11-08 sanitize family wire malformed/property matrix
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/repos"
          c++ -std=c++17 -Wall -Wextra -Werror -fno-rtti \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            validator/tests/platform_wire_malformed_property.cpp \
            -I"$root/ESPressio-Primitive/src" \
            -I"$root/ESPressio-System/src" \
            -I"$root/ESPressio-Serializable/src" \
            -I"$root/ESPressio-Persistence/src" \
            -I"$root/ESPressio-Security/src" \
            -I"$root/ESPressio-Timing/src" \
            -I"$root/ESPressio-Timing/tests/stubs" \
            -I"$root/ESPressio-Units/src" \
            -I"$root/ESPressio-Event/src" \
            -I"$root/ESPressio-Command/src" \
            -I"$root/ESPressio-State/src" \
            -o /tmp/platform_wire_malformed_property
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/platform_wire_malformed_property

      - name: V11-09 execute capacity, exhaustion and no-hidden-heap contracts
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/repos"

          configure_and_run() {
            local repo="$1"
            local build="$2"
            local regex="$3"
            shift 3
            cmake -S "$root/ESPressio-${repo}/tests" -B "$build" "$@"
            cmake --build "$build" --parallel 2
            ctest --test-dir "$build" --output-on-failure -R "$regex"
          }

          configure_and_run Event /tmp/v11-event \
            'event_(pool_lifetime|thread_capability|blocking_admission|remote_receipts|remote_contention)' \
            -DESPRESSIO_DEPENDENCIES="$root"

          configure_and_run Command /tmp/v11-command \
            'command_(runtime|response_capability|critical_execution|no_heap)' \
            -DESPRESSIO_DEPENDENCIES="$root"

          configure_and_run Adapters /tmp/v11-adapters \
            'adapter_(byte_arena|capacity|capacity_rollback|capacity_fit|no_heap|runtime_no_heap|resources|stress)' \
            -DESPRESSIO_DEPENDENCIES="$root"

          configure_and_run Task /tmp/v11-task \
            '(idle_worker|executor|configuration|rejected_contracts)' \
            -DESPRESSIO_SYSTEM_SOURCE_DIR="$root/ESPressio-System"

          configure_and_run Threads /tmp/v11-threads \
            '(composition|common_wake_and_deadlines)' \
            -DESPRESSIO_DEPENDENCIES="$root"

          radio="$root/ESPressio-Radio"
          common=(
            -std=c++17 -Wall -Wextra -Werror -fno-rtti -pthread
            -I"$radio/src"
            -I"$root/ESPressio-System/src"
            -I"$root/ESPressio-Timing/src"
          )
          for test in \
            radio_capacity_redesign_tests \
            radio_resource_accounting_tests \
            radio_reassembly_redesign_tests \
            radio_validation_hardening_tests \
            radio_scheduler_redesign_tests
          do
            c++ "${common[@]}" "$radio/tests/${test}.cpp" -o "/tmp/${test}"
            "/tmp/${test}"
          done

      - name: V11-10 execute shutdown, restart, generation and stale-handle contracts
        shell: bash
        run: bash validator/tools/run_v11_lifecycle_validation.sh "$GITHUB_WORKSPACE/repos"

      - name: Validate final dynamic tooling contracts
        run: python validator/tools/validate_dynamic_tooling.py repos

      - name: Validate real Thread capability composition
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/repos"
          test -f "$root/ESPressio-Observable/src/ESPressio_IObserver.hpp"
          c++ -std=c++17 -Wall -Wextra -Werror -fno-rtti -pthread \
            validator/tests/platform_thread_capability_integration.cpp \
            -I"$root/ESPressio-Primitive/src" \
            -I"$root/ESPressio-System/src" \
            -I"$root/ESPressio-Serializable/src" \
            -I"$root/ESPressio-Persistence/src" \
            -I"$root/ESPressio-Security/src" \
            -I"$root/ESPressio-Task/src" \
            -I"$root/ESPressio-Task/tests" \
            -I"$root/ESPressio-Timing/src" \
            -I"$root/ESPressio-Timing/tests/stubs" \
            -I"$root/ESPressio-Units/src" \
            -I"$root/ESPressio-Observable/src" \
            -I"$root/ESPressio-Threads/src" \
            -I"$root/ESPressio-Event/src" \
            -I"$root/ESPressio-Command/src" \
            -I"$root/ESPressio-State/src" \
            -o /tmp/platform_thread_capability_integration
          /tmp/platform_thread_capability_integration
