name: CI
on:
  push:
    branches: [main, primitives_redesign]
  pull_request:
jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Run reviewed contract tests
        run: ctest --test-dir build --output-on-failure
      - name: Negative compile contracts and independent public headers
        run: python3 tests/check_compile_contracts.py
