name: CI

on:
  push:
    branches:
      - main
      - structural_realignment
      - 'structural_realignment_propagation*'
      - 'feature/**'
      - 'optimisation/**'
  pull_request:

jobs:
  host-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build primitive vocabulary regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/primitive_types_test.cpp -o primitive_types_test
      - name: Run primitive vocabulary regression
        run: ./primitive_types_test
